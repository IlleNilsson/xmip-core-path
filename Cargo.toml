# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-path"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-path"
description = "Path declarations and path execution contracts for Xmip."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
# The Stream a path's content is parsed from once and a rewrite produces
# (content.rs, rewriting.rs), the StreamId it carries, and the JSON document
# the JSON path technologies share (json.rs, ADR-0044).
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
serde_json = "1"
# Xmip's expression language (expression.rs, ADR-0066): its lexer reads
# through the one character reader, and an expression is read from and
# written to configuration as its text.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
serde = "1"

[dev-dependencies]
# Only the tests read an expression out of a TOML document.
toml = "0.9"

[profile.dev.package."*"]
opt-level = 3
